<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form - Absolute Alignment Fix</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .page-container {
      position: relative;
      width: 794px;
      height: 1123px;
      margin: 20px 0;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .clean-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: 13.5px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 5px;
      font-family: Arial, sans-serif;
    }

    .clean-input:focus {
      background: rgba(255, 255, 180, 0.5);
    }

    .clean-checkbox {
      position: absolute;
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    .photo-overlay {
      position: absolute;
      top: 145px;
      left: 72px;
      width: 100px;
      height: 115px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: 794px;
        height: 1123px;
        background: none;
        margin: 0;
        padding: 0;
      }
      .controls {
        display: none !important;
      }
      .page-container {
        margin: 0 !important;
        box-shadow: none !important;
        width: 794px !important;
        height: 1123px !important;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- Photo Field -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- Top Row Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 198px; left: 198px;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 198px; left: 301px;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 198px; left: 405px;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 198px; left: 517px;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 198px; left: 627px;"> <!-- POLICE -->

      <!-- Second Row Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 250px; left: 208px;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 250px; left: 345px;"> <!-- IMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 250px; left: 446px;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 250px; left: 555px;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 250px; left: 673px;"> <!-- DU TOWER -->

      <!-- Main Form Line Inputs -->
      <input type="text" class="clean-input" style="top: 288px; left: 250px; width: 360px;"> <!-- FULL NAME -->
      <input type="text" class="clean-input" style="top: 323px; left: 250px; width: 360px;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 358px; left: 250px; width: 360px;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 393px; left: 250px; width: 360px;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 428px; left: 250px; width: 360px;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 463px; left: 250px; width: 360px;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 498px; left: 250px; width: 360px;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 533px; left: 250px; width: 360px;"> <!-- ADDRESS & TEL NO -->
      <input type="text" class="clean-input" style="top: 568px; left: 250px; width: 360px;"> <!-- MOBILE NO -->
      <input type="text" class="clean-input" style="top: 603px; left: 250px; width: 360px;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 638px; left: 250px; width: 360px;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 673px; left: 250px; width: 360px;"> <!-- SIGNATURE -->
      <input type="text" class="clean-input" style="top: 708px; left: 250px; width: 360px;"> <!-- VISA VALIDITY DATE -->

      <!-- Corrected Bottom Period Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 686px; left: 245px;"> <!-- WEEK -->
      <input type="checkbox" class="clean-checkbox" style="top: 686px; left: 420px;"> <!-- MONTH -->
      <input type="checkbox" class="clean-checkbox" style="top: 686px; left: 540px;"> <!-- YEAR -->

      <!-- Bottom Period Text Fields (From / To) -->
      <input type="text" class="clean-input" style="top: 726px; left: 220px; width: 85px; text-align: center;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 726px; left: 335px; width: 85px; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
