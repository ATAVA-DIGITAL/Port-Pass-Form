<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form Overlay</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #525659;
      margin: 0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* Standard A4 Aspect Ratio Container */
    .page-container {
      position: relative;
      width: 800px;
      height: 1131px;
      margin-bottom: 30px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    /* Background Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Form Overlay */
    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Clean Input Fields without extra borders */
    .clean-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 4px;
      font-family: Arial, sans-serif;
    }

    /* Highlight slightly on focus while typing */
    .clean-input:focus {
      background: rgba(255, 255, 200, 0.4);
    }

    /* Clean Checkboxes aligned with background boxes */
    .clean-checkbox {
      position: absolute;
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    /* Photo Upload Overlay */
    .photo-overlay {
      position: absolute;
      top: 139px;
      left: 62px;
      width: 95px;
      height: 112px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Controls */
    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .controls {
        display: none;
      }
      .page-container {
        box-shadow: none;
        page-break-after: always;
        margin: 0;
        width: 100%;
        height: 100vh;
      }
      .clean-input:focus {
        background: transparent;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- Photo Field -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- Top Row Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 231px;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 343px;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 472px;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 610px;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 762px;"> <!-- POLICE -->

      <!-- Second Row Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 231px;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 395px;"> <!-- IMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 516px;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 647px;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 787px;"> <!-- DU TOWER -->

      <!-- Text Inputs (Correctly Aligned on lines) -->
      <input type="text" class="clean-input" style="top: 295px; left: 295px; width: 380px; height: 20px;"> <!-- APPLICANT'S FULL NAME -->
      <input type="text" class="clean-input" style="top: 331px; left: 295px; width: 380px; height: 20px;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 367px; left: 295px; width: 380px; height: 20px;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 403px; left: 295px; width: 380px; height: 20px;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 439px; left: 295px; width: 380px; height: 20px;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 475px; left: 295px; width: 380px; height: 20px;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 511px; left: 295px; width: 380px; height: 20px;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 547px; left: 295px; width: 380px; height: 20px;"> <!-- COMPANY ADDRESS & TEL -->
      <input type="text" class="clean-input" style="top: 583px; left: 295px; width: 380px; height: 20px;"> <!-- APPLICANT'S MOBILE NO -->
      <input type="text" class="clean-input" style="top: 619px; left: 295px; width: 380px; height: 20px;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 655px; left: 295px; width: 380px; height: 20px;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 691px; left: 295px; width: 380px; height: 20px;"> <!-- APPLICANT'S SIGNATURE -->
      <input type="text" class="clean-input" style="top: 727px; left: 295px; width: 380px; height: 20px;"> <!-- VISA VALIDITY DATE -->

      <!-- Period Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 752px; left: 274px;"> <!-- WEEK -->
      <input type="checkbox" class="clean-checkbox" style="top: 752px; left: 485px;"> <!-- MONTH -->
      <input type="checkbox" class="clean-checkbox" style="top: 752px; left: 632px;"> <!-- YEAR -->

      <!-- Validity Inputs -->
      <input type="text" class="clean-input" style="top: 792px; left: 253px; width: 92px; height: 20px;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 792px; left: 388px; width: 92px; height: 20px;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
