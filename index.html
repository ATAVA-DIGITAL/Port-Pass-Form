<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Application Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #525659;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    /* Print Header Button */
    .print-btn-container {
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      text-align: center;
    }

    .btn-print {
      background-color: #28a745;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .btn-print:hover {
      background-color: #218838;
    }

    /* Page Container */
    .page-container {
      width: 800px;
      background: #ffffff;
      position: relative;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .page-image {
      width: 100%;
      display: block;
    }

    /* Clickable Photo Box Position */
    .photo-box {
      position: absolute;
      top: 13.0%;
      left: 7.0%;
      width: 110px;
      height: 130px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Hidden File Input */
    #fileInput {
      display: none;
    }

    /* Print CSS for Exact 2 Pages Only */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        margin: 0;
        padding: 0;
        background: none;
      }
      .no-print, button, .print-btn-container {
        display: none !important;
      }
      .page-container {
        page-break-after: always;
        page-break-inside: avoid;
        margin: 0 !important;
        box-shadow: none !important;
        width: 100% !important;
      }
      .page-container:last-child {
        page-break-after: auto;
      }
    }
  </style>
</head>
<body>

  <!-- Print Button -->
  <div class="print-btn-container no-print">
    <button class="btn-print" onclick="window.print()">
      Print / Save 2 Pages as PDF / Powered by : ATAVA DIGITAL SERVICES & TRADING
    </button>
  </div>

  <!-- Hidden Photo File Input -->
  <input type="file" id="fileInput" accept="image/*" onchange="previewPhoto(event)">

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="page1.jpg" class="page-image" alt="Port Pass Page 1">

    <!-- Interactive Photo Area -->
    <div class="photo-box" onclick="document.getElementById('fileInput').click();" title="Click to Upload Photo">
      <img id="uploadedPhoto" src="" alt="">
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="page2.jpg" class="page-image" alt="Port Pass Page 2">
  </div>

  <script>
    function previewPhoto(event) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById('uploadedPhoto').src = reader.result;
      };
      if (event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
