<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form - Absolute Print Lock Fix</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* Standard Fixed Page Screen Container */
    .page-container {
      position: relative;
      width: 800px;
      height: 1060px;
      margin: 20px 0;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* Original Background Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Interactive Form Overlay */
    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Inputs Perfectly Sits On Lines */
    .clean-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: 13.5px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 5px;
      font-family: Arial, sans-serif;
    }

    .clean-input:focus {
      background: rgba(255, 255, 180, 0.5);
    }

    /* Checkboxes Fixed Inside Boxes */
    .clean-checkbox {
      position: absolute;
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    /* Photo Upload Box */
    .photo-overlay {
      position: absolute;
      top: 138px;
      left: 65px;
      width: 98px;
      height: 108px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Fixed Print Button */
    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* ABSOLUTE PRINT LOCK SYSTEM */
    @page {
      size: A4 portrait;
      margin: 0 !important;
    }

    @media print {
      body {
        background: white !important;
      }
      .controls {
        display: none !important;
      }
      .page-container {
        margin: 0 !important;
        box-shadow: none !important;
        width: 100% !important;
        height: 100vh !important;
        page-break-after: always;
      }
      .clean-input:focus {
        background: transparent !important;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- Photo Field -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- Checkboxes Row 1 (Top) -->
      <input type="checkbox" class="clean-checkbox" style="top: 188px; left: 198px;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 188px; left: 301px;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 188px; left: 405px;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 188px; left: 517px;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 188px; left: 627px;"> <!-- POLICE -->

      <!-- Checkboxes Row 2 -->
      <input type="checkbox" class="clean-checkbox" style="top: 238px; left: 208px;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 238px; left: 345px;"> <!-- IMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 238px; left: 446px;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 238px; left: 555px;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 238px; left: 673px;"> <!-- DU TOWER -->

      <!-- Main Form Line Inputs -->
      <input type="text" class="clean-input" style="top: 276px; left: 250px; width: 360px;"> <!-- FULL NAME -->
      <input type="text" class="clean-input" style="top: 310px; left: 250px; width: 360px;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 343px; left: 250px; width: 360px;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 376px; left: 250px; width: 360px;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 409px; left: 250px; width: 360px;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 442px; left: 250px; width: 360px;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 476px; left: 250px; width: 360px;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 509px; left: 250px; width: 360px;"> <!-- ADDRESS & TEL NO -->
      <input type="text" class="clean-input" style="top: 542px; left: 250px; width: 360px;"> <!-- MOBILE NO -->
      <input type="text" class="clean-input" style="top: 575px; left: 250px; width: 360px;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 608px; left: 250px; width: 360px;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 641px; left: 250px; width: 360px;"> <!-- SIGNATURE -->
      <input type="text" class="clean-input" style="top: 674px; left: 250px; width: 360px;"> <!-- VISA VALIDITY DATE -->

      <!-- Bottom Period Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 686px; left: 242px;"> <!-- WEEK -->
      <input type="checkbox" class="clean-checkbox" style="top: 686px; left: 418px;"> <!-- MONTH -->
      <input type="checkbox" class="clean-checkbox" style="top: 686px; left: 539px;"> <!-- YEAR -->

      <!-- Bottom Validity Dates (From / To Boxes) -->
      <input type="text" class="clean-input" style="top: 724px; left: 222px; width: 80px; text-align: center;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 724px; left: 337px; width: 80px; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
