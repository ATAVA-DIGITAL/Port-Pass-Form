<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form Overlay - Perfect Responsive Alignment</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #333333;
      margin: 0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* Responsive A4 Container */
    .page-container {
      position: relative;
      width: 100%;
      max-width: 850px;
      aspect-ratio: 1 / 1.414; /* Locks precise A4 ratio */
      margin-bottom: 30px;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* Background Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      object-fit: contain;
    }

    /* Overlay Layer */
    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Clean Input Fields - Exactly aligned on background lines */
    .clean-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: clamp(10px, 1.4vw, 14px);
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 4px;
      font-family: Arial, sans-serif;
    }

    .clean-input:focus {
      background: rgba(255, 255, 180, 0.4);
    }

    /* Perfectly centered Checkbox overlays */
    .clean-checkbox {
      position: absolute;
      width: 1.8%;
      height: 1.8%;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
      transform: scale(1.1);
    }

    /* Photo Upload Box */
    .photo-overlay {
      position: absolute;
      top: 12.5%;
      left: 8.2%;
      width: 12.8%;
      height: 10.2%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Print Button */
    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* PRINT CLEANUP: Removes Headers, Footers, URLs & Extra Margins */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: none;
        padding: 0;
        margin: 0;
      }
      .controls {
        display: none;
      }
      .page-container {
        box-shadow: none;
        page-break-after: always;
        margin: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
      }
      .clean-input:focus {
        background: transparent;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- Photo Field -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- Row 1 Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 18.0%; left: 23.3%;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 18.0%; left: 36.3%;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 18.0%; left: 49.0%;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 18.0%; left: 63.2%;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 18.0%; left: 77.2%;"> <!-- POLICE -->

      <!-- Row 2 Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 23.8%; left: 24.5%;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 23.8%; left: 41.8%;"> <!-- IMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 23.8%; left: 54.6%;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 23.8%; left: 68.6%;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 23.8%; left: 83.5%;"> <!-- DU TOWER -->

      <!-- Main Text Inputs (Percentage aligned directly over form underlines) -->
      <input type="text" class="clean-input" style="top: 27.2%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- FULL NAME -->
      <input type="text" class="clean-input" style="top: 30.4%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 33.6%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 36.8%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 40.0%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 43.2%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 46.4%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 49.6%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- ADDRESS & TEL NO -->
      <input type="text" class="clean-input" style="top: 52.8%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- MOBILE NO -->
      <input type="text" class="clean-input" style="top: 56.0%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 59.2%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 62.4%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- SIGNATURE -->
      <input type="text" class="clean-input" style="top: 65.6%; left: 31.5%; width: 45.5%; height: 2.2%;"> <!-- VISA VALIDITY DATE -->

      <!-- Period Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 69.5%; left: 29.0%;"> <!-- WEEK -->
      <input type="checkbox" class="clean-checkbox" style="top: 69.5%; left: 51.3%;"> <!-- MONTH -->
      <input type="checkbox" class="clean-checkbox" style="top: 69.5%; left: 66.8%;"> <!-- YEAR -->

      <!-- Validity Period Inputs -->
      <input type="text" class="clean-input" style="top: 73.0%; left: 26.8%; width: 10.5%; height: 2.2%; text-align: center;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 73.0%; left: 41.3%; width: 10.5%; height: 2.2%; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
