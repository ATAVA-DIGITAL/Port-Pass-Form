<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Page Setup A4 */
    .form-container {
      position: relative;
      width: 210mm;
      height: 297mm;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    /* Background Original Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Form Overlays */
    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Transparent Text Input Styling */
    .field {
      position: absolute;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      padding: 0 5px;
    }

    /* Slight yellow highlight while typing only */
    .field:focus {
      background: rgba(255, 255, 0, 0.2);
    }

    /* Transparent Checkbox Styling */
    .chk {
      position: absolute;
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #000;
      opacity: 0.8;
    }

    /* Photo Upload Box Positioning */
    .photo-box {
      position: absolute;
      top: 12.6%;
      left: 6.8%;
      width: 126px;
      height: 102px;
      cursor: pointer;
    }

    .photo-box input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .photo-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      position: absolute;
      z-index: 1;
    }

    /* Checkbox Exact Coordinates */
    .chk-police     { top: 17.2%; left: 78.5%; }
    .chk-roro       { top: 17.2%; left: 62.7%; }
    .chk-company    { top: 17.2%; left: 50.3%; }
    .chk-warehouse  { top: 17.2%; left: 36.5%; }
    .chk-quay       { top: 17.2%; left: 24.6%; }

    .chk-dutower    { top: 22.7%; left: 83.7%; }
    .chk-allplaces  { top: 22.7%; left: 68.6%; }
    .chk-ship       { top: 22.7%; left: 54.5%; }
    .chk-imigration { top: 22.7%; left: 41.9%; }
    .chk-container  { top: 22.7%; left: 24.6%; }

    /* Text Lines Exact Positions */
    .field-fullname     { top: 26.0%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-nationality  { top: 28.9%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-profession   { top: 31.9%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-passport     { top: 34.9%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-uid          { top: 37.8%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-emiratesid   { top: 40.8%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-companyname  { top: 43.8%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-companyaddr  { top: 46.8%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-mobile       { top: 49.7%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-reason       { top: 52.7%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-appdate      { top: 55.7%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-signature    { top: 58.7%; left: 31.5%; width: 45.5%; height: 2.2%; }
    .field-visavalidity { top: 61.6%; left: 31.5%; width: 45.5%; height: 2.2%; }

    /* Period Inputs */
    .field-week  { top: 65.8%; left: 29.0%; width: 5.0%; height: 2.0%; }
    .field-month { top: 65.8%; left: 51.5%; width: 5.0%; height: 2.0%; }
    .field-year  { top: 65.8%; left: 67.2%; width: 5.0%; height: 2.0%; }

    /* Pass Validity Inputs */
    .field-valid-from { top: 69.4%; left: 26.6%; width: 10.8%; height: 2.0%; }
    .field-valid-to   { top: 69.4%; left: 41.3%; width: 10.8%; height: 2.0%; }

    /* Print Setup */
    @media print {
      body {
        background: none;
        padding: 0;
      }
      .no-print {
        display: none;
      }
      .form-container {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <!-- Print Button -->
  <div class="no-print" style="margin-bottom: 15px; text-align: center;">
    <button onclick="window.print()" style="padding: 10px 25px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px;">Print / Save as PDF</button>
  </div>

  <div class="form-container">
    <!-- Clean Original Background Image -->
    <img src="GATE PASS13081_page-0001.jpg" alt="Port Pass Template" class="bg-image">

    <!-- Form Overlay -->
    <form class="overlay-form">

      <!-- Photo Upload Slot -->
      <div class="photo-box">
        <input type="file" accept="image/*" id="photoInput" onchange="previewPhoto(event)">
        <img id="photoPreview" class="photo-preview" alt="">
      </div>

      <!-- Checkboxes -->
      <input type="checkbox" class="chk chk-police" name="loc_police">
      <input type="checkbox" class="chk chk-roro" name="loc_roro">
      <input type="checkbox" class="chk chk-company" name="loc_company">
      <input type="checkbox" class="chk chk-warehouse" name="loc_warehouse">
      <input type="checkbox" class="chk chk-quay" name="loc_quay">
      <input type="checkbox" class="chk chk-container" name="loc_container">
      <input type="checkbox" class="chk chk-imigration" name="loc_imigration">
      <input type="checkbox" class="chk chk-ship" name="loc_ship">
      <input type="checkbox" class="chk chk-allplaces" name="loc_allplaces">
      <input type="checkbox" class="chk chk-dutower" name="loc_dutower">

      <!-- Transparent Text Fields on Lines -->
      <input type="text" class="field field-fullname" name="applicant_fullname">
      <input type="text" class="field field-nationality" name="nationality">
      <input type="text" class="field field-profession" name="profession">
      <input type="text" class="field field-passport" name="passport_no">
      <input type="text" class="field field-uid" name="uid_no">
      <input type="text" class="field field-emiratesid" name="emirates_id">
      <input type="text" class="field field-companyname" name="company_name">
      <input type="text" class="field field-companyaddr" name="company_address_tel">
      <input type="text" class="field field-mobile" name="mobile_no">
      <input type="text" class="field field-reason" name="reason_for_pass">
      <input type="text" class="field field-appdate" name="date_of_application">
      <input type="text" class="field field-signature" name="applicant_signature">
      <input type="text" class="field field-visavalidity" name="visa_validity_date">

      <!-- Period Inputs -->
      <input type="text" class="field field-week" name="period_week">
      <input type="text" class="field field-month" name="period_month">
      <input type="text" class="field field-year" name="period_year">

      <!-- Pass Validity Inputs -->
      <input type="text" class="field field-valid-from" name="validity_from">
      <input type="text" class="field field-valid-to" name="validity_to">

    </form>
  </div>

  <script>
    function previewPhoto(event) {
      const reader = new FileReader();
      reader.onload = function() {
        const output = document.getElementById('photoPreview');
        output.src = reader.result;
        output.style.display = 'block';
      };
      reader.readAsDataURL(event.target.files[0]);
    }
  </script>
</body>
</html>
