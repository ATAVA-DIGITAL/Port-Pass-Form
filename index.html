<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form - Complete Overlay</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .page-container {
      position: relative;
      width: 794px;
      height: 1123px;
      margin: 20px 0;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      page-break-after: always;
      page-break-inside: avoid;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .clean-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: 13.5px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 4px;
      font-family: Arial, sans-serif;
    }

    .clean-input:focus {
      background: rgba(255, 255, 180, 0.4);
    }

    .clean-checkbox {
      position: absolute;
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    .photo-overlay {
      position: absolute;
      top: 130px;
      left: 54px;
      width: 100px;
      height: 102px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    @page {
      size: A4 portrait;
      margin: 0mm !important;
    }

    @media print {
      html, body {
        width: 210mm !important;
        height: 297mm !important;
        background: white !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .controls {
        display: none !important;
      }
      .page-container {
        width: 210mm !important;
        height: 297mm !important;
        position: relative !important;
        margin: 0 !important;
        box-shadow: none !important;
        page-break-after: always !important;
        page-break-inside: avoid !important;
      }
      .clean-input:focus {
        background: transparent !important;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <!-- background image set as original template -->
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- 1. UPLOAD PHOTO RED AREA -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- 2. CHECKBOXES (TOP ROW) -->
      <input type="checkbox" class="clean-checkbox" style="top: 172px; left: 198px;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 172px; left: 288px;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 172px; left: 398px;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 172px; left: 518px;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 172px; left: 625px;"> <!-- POLICE -->

      <!-- 3. CHECKBOXES (SECOND ROW) -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 195px;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 332px;"> <!-- IMMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 432px;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 543px;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 663px;"> <!-- DU TOWER -->

      <!-- 4. MAIN FORM LINES -->
      <input type="text" class="clean-input" style="top: 256px; left: 248px; width: 362px;"> <!-- APPLICANT'S FULL NAME -->
      <input type="text" class="clean-input" style="top: 288px; left: 248px; width: 362px;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 320px; left: 248px; width: 362px;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 352px; left: 248px; width: 362px;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 384px; left: 248px; width: 362px;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 416px; left: 248px; width: 362px;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 448px; left: 248px; width: 362px;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 480px; left: 248px; width: 362px;"> <!-- COMPANY ADDRESS & TEL NO -->
      <input type="text" class="clean-input" style="top: 512px; left: 248px; width: 362px;"> <!-- APPLICANT'S MOBILE NO -->
      <input type="text" class="clean-input" style="top: 544px; left: 248px; width: 362px;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 576px; left: 248px; width: 362px;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 608px; left: 248px; width: 362px;"> <!-- APPLICANT'S SIGNATURE -->
      <input type="text" class="clean-input" style="top: 638px; left: 248px; width: 362px;"> <!-- APPLICANT'S VISA VALIDITY DATE -->

      <!-- 5. PORT PASS PERIOD (WEEK / MONTH / YEAR) -->
      <input type="text" class="clean-input" style="top: 668px; left: 230px; width: 40px; height: 18px; text-align: center;"> <!-- WEEK -->
      <input type="text" class="clean-input" style="top: 668px; left: 408px; width: 40px; height: 18px; text-align: center;"> <!-- MONTH -->
      <input type="text" class="clean-input" style="top: 668px; left: 532px; width: 40px; height: 18px; text-align: center;"> <!-- YEAR -->

      <!-- 6. PORT PASS VALIDITY (FROM / TO) -->
      <input type="text" class="clean-input" style="top: 700px; left: 213px; width: 84px; height: 20px; text-align: center;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 700px; left: 328px; width: 84px; height: 20px; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
