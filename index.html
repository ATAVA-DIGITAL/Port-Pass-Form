<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form Overlay - Perfect Alignment</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #525659;
      margin: 0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* Standard Pixel Precision Container for Form Image */
    .page-container {
      position: relative;
      width: 800px;
      height: 1131px;
      margin-bottom: 30px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    /* Original Image Background */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Form Interactive Overlay Layer */
    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Fully Transparent Clean Input Fields */
    .clean-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: 13.5px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 5px;
      font-family: Arial, sans-serif;
      line-height: 1;
    }

    /* Slight yellow guide while typing, transparent on printing */
    .clean-input:focus {
      background: rgba(255, 255, 180, 0.4);
    }

    /* Checkbox overlay precisely fitted into image boxes */
    .clean-checkbox {
      position: absolute;
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    /* Photo Upload Container */
    .photo-overlay {
      position: absolute;
      top: 142px;
      left: 68px;
      width: 100px;
      height: 114px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* On-Screen Print Button */
    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* PRINT SETTINGS (Removes Header, Footer, URL, Page Numbers) */
    @page {
      size: A4 portrait;
      margin: 0; /* Clears browser default header and footer */
    }

    @media print {
      body {
        background: none;
        padding: 0;
        margin: 0;
      }
      .controls {
        display: none;
      }
      .page-container {
        box-shadow: none;
        page-break-after: always;
        margin: 0;
        width: 100%;
        height: 100vh;
      }
      .clean-input:focus {
        background: transparent;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- Photo Field -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- Row 1 Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 232px;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 364px;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 500px;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 647px;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 191px; left: 827px;"> <!-- POLICE -->

      <!-- Row 2 Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 244px;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 418px;"> <!-- IMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 546px;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 686px;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 251px; left: 835px;"> <!-- DU TOWER -->

      <!-- Text Inputs Aligned Exactly Above Lines -->
      <input type="text" class="clean-input" style="top: 289px; left: 252px; width: 365px; height: 18px;"> <!-- FULL NAME -->
      <input type="text" class="clean-input" style="top: 322px; left: 252px; width: 365px; height: 18px;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 354px; left: 252px; width: 365px; height: 18px;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 386px; left: 252px; width: 365px; height: 18px;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 419px; left: 252px; width: 365px; height: 18px;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 451px; left: 252px; width: 365px; height: 18px;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 483px; left: 252px; width: 365px; height: 18px;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 516px; left: 252px; width: 365px; height: 18px;"> <!-- ADDRESS & TEL -->
      <input type="text" class="clean-input" style="top: 548px; left: 252px; width: 365px; height: 18px;"> <!-- MOBILE NO -->
      <input type="text" class="clean-input" style="top: 580px; left: 252px; width: 365px; height: 18px;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 613px; left: 252px; width: 365px; height: 18px;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 645px; left: 252px; width: 365px; height: 18px;"> <!-- SIGNATURE -->
      <input type="text" class="clean-input" style="top: 677px; left: 252px; width: 365px; height: 18px;"> <!-- VISA VALIDITY DATE -->

      <!-- Period Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 720px; left: 290px;"> <!-- WEEK -->
      <input type="checkbox" class="clean-checkbox" style="top: 720px; left: 513px;"> <!-- MONTH -->
      <input type="checkbox" class="clean-checkbox" style="top: 720px; left: 668px;"> <!-- YEAR -->

      <!-- Validity Date Inputs -->
      <input type="text" class="clean-input" style="top: 766px; left: 212px; width: 85px; height: 22px; text-align: center;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 766px; left: 330px; width: 85px; height: 22px; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
