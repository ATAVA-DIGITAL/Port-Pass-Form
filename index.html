<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form Overlay - Pixel Perfect Fixed</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #333333;
      margin: 0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* Fixed Container matching standard image dimensions */
    .page-container {
      position: relative;
      width: 800px;
      height: 1060px;
      margin-bottom: 30px;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* Background Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Interactive Overlay */
    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Clean Input Fields - Floating perfectly on top of lines */
    .clean-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 5px;
      font-family: Arial, sans-serif;
      transform: translateY(-100%); /* Sits the text directly on the baseline */
    }

    .clean-input:focus {
      background: rgba(255, 255, 180, 0.5);
    }

    /* Precision Checkboxes */
    .clean-checkbox {
      position: absolute;
      width: 15px;
      height: 15px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    /* Photo Upload Area */
    .photo-overlay {
      position: absolute;
      top: 130px;
      left: 65px;
      width: 98px;
      height: 108px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Print Controls */
    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* Print Specific Rule: Strips header/footer URLs and margins */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: none;
        padding: 0;
        margin: 0;
      }
      .controls {
        display: none;
      }
      .page-container {
        box-shadow: none;
        page-break-after: always;
        margin: 0;
        width: 100%;
        height: 100vh;
      }
      .clean-input:focus {
        background: transparent;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- Photo Area -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- Row 1 Checkboxes (Aligned exactly inside image squares) -->
      <input type="checkbox" class="clean-checkbox" style="top: 178px; left: 185px;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 178px; left: 290px;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 178px; left: 395px;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 178px; left: 508px;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 178px; left: 622px;"> <!-- POLICE -->

      <!-- Row 2 Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 195px;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 334px;"> <!-- IMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 436px;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 548px;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 228px; left: 667px;"> <!-- DU TOWER -->

      <!-- Text Inputs (Adjusted per line baseline offset) -->
      <input type="text" class="clean-input" style="top: 278px; left: 250px; width: 365px;"> <!-- APPLICANT'S FULL NAME -->
      <input type="text" class="clean-input" style="top: 309px; left: 250px; width: 365px;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 339px; left: 250px; width: 365px;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 370px; left: 250px; width: 365px;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 401px; left: 250px; width: 365px;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 432px; left: 250px; width: 365px;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 462px; left: 250px; width: 365px;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 493px; left: 250px; width: 365px;"> <!-- COMPANY ADDRESS & TEL NO -->
      <input type="text" class="clean-input" style="top: 524px; left: 250px; width: 365px;"> <!-- APPLICANT'S MOBILE NO -->
      <input type="text" class="clean-input" style="top: 555px; left: 250px; width: 365px;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 585px; left: 250px; width: 365px;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 616px; left: 250px; width: 365px;"> <!-- APPLICANT'S SIGNATURE -->
      <input type="text" class="clean-input" style="top: 647px; left: 250px; width: 365px;"> <!-- VISA VALIDITY DATE -->

      <!-- Period Checkboxes -->
      <input type="checkbox" class="clean-checkbox" style="top: 662px; left: 232px;"> <!-- WEEK -->
      <input type="checkbox" class="clean-checkbox" style="top: 662px; left: 410px;"> <!-- MONTH -->
      <input type="checkbox" class="clean-checkbox" style="top: 662px; left: 535px;"> <!-- YEAR -->

      <!-- Validity Period Inputs -->
      <input type="text" class="clean-input" style="top: 708px; left: 215px; width: 85px; text-align: center;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 708px; left: 332px; width: 85px; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
