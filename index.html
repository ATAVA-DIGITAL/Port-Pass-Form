<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form - Visual Drag & Drop Alignment</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .page-container {
      position: relative;
      width: 794px;
      height: 1123px;
      margin: 20px 0;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      page-break-after: always;
      page-break-inside: avoid;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .clean-input {
      position: absolute;
      background: transparent;
      border: 1px dashed transparent;
      font-size: 13.5px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 2px;
      font-family: Arial, sans-serif;
    }

    .clean-checkbox {
      position: absolute;
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    /* Dragging Mode Styles */
    body.drag-mode .clean-checkbox,
    body.drag-mode .clean-input {
      border: 1px solid red !important;
      background: rgba(255, 0, 0, 0.2) !important;
      cursor: move !important;
    }

    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 16px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .btn-toggle { background-color: #d32f2f; }

    #codeOutput {
      width: 794px;
      height: 200px;
      margin-bottom: 50px;
      display: none;
    }

    @page { size: A4 portrait; margin: 0mm !important; }

    @media print {
      body { background: white !important; }
      .controls, #codeOutput { display: none !important; }
      .page-container { margin: 0 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn btn-toggle" onclick="toggleDragMode()">🛠️ Drag Mode: OFF</button>
    <button class="btn" onclick="generateCode()">💾 Get Updated CSS Code</button>
    <button class="btn" onclick="window.print()">🖨️ Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container" id="page1">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- TOP ROW CHECKBOXES -->
      <input type="checkbox" id="cb_quay" class="clean-checkbox draggable" style="top: 215px; left: 200px;">
      <input type="checkbox" id="cb_wh" class="clean-checkbox draggable" style="top: 215px; left: 300px;">
      <input type="checkbox" id="cb_comp" class="clean-checkbox draggable" style="top: 215px; left: 400px;">
      <input type="checkbox" id="cb_roro" class="clean-checkbox draggable" style="top: 215px; left: 500px;">
      <input type="checkbox" id="cb_police" class="clean-checkbox draggable" style="top: 215px; left: 600px;">

      <!-- SECOND ROW CHECKBOXES -->
      <input type="checkbox" id="cb_container" class="clean-checkbox draggable" style="top: 268px; left: 200px;">
      <input type="checkbox" id="cb_immig" class="clean-checkbox draggable" style="top: 268px; left: 340px;">
      <input type="checkbox" id="cb_ship" class="clean-checkbox draggable" style="top: 268px; left: 440px;">
      <input type="checkbox" id="cb_all" class="clean-checkbox draggable" style="top: 268px; left: 550px;">
      <input type="checkbox" id="cb_du" class="clean-checkbox draggable" style="top: 268px; left: 660px;">

      <!-- TEXT INPUTS -->
      <input type="text" id="inp_name" class="clean-input draggable" style="top: 312px; left: 250px; width: 360px;">
      <input type="text" id="inp_nation" class="clean-input draggable" style="top: 348px; left: 250px; width: 360px;">
      <input type="text" id="inp_prof" class="clean-input draggable" style="top: 383px; left: 250px; width: 360px;">
      <input type="text" id="inp_pass" class="clean-input draggable" style="top: 418px; left: 250px; width: 360px;">
      <input type="text" id="inp_uid" class="clean-input draggable" style="top: 453px; left: 250px; width: 360px;">
      <input type="text" id="inp_eid" class="clean-input draggable" style="top: 488px; left: 250px; width: 360px;">
      <input type="text" id="inp_cname" class="clean-input draggable" style="top: 523px; left: 250px; width: 360px;">
      <input type="text" id="inp_cadd" class="clean-input draggable" style="top: 558px; left: 250px; width: 360px;">
      <input type="text" id="inp_mob" class="clean-input draggable" style="top: 593px; left: 250px; width: 360px;">
      <input type="text" id="inp_reason" class="clean-input draggable" style="top: 628px; left: 250px; width: 360px;">
      <input type="text" id="inp_date" class="clean-input draggable" style="top: 663px; left: 250px; width: 360px;">
      <input type="text" id="inp_sign" class="clean-input draggable" style="top: 698px; left: 250px; width: 360px;">
      <input type="text" id="inp_visa" class="clean-input draggable" style="top: 733px; left: 250px; width: 360px;">

      <!-- BOTTOM BOXES -->
      <input type="text" id="inp_week" class="clean-input draggable" style="top: 792px; left: 250px; width: 45px; height: 18px; text-align: center;">
      <input type="text" id="inp_month" class="clean-input draggable" style="top: 792px; left: 400px; width: 45px; height: 18px; text-align: center;">
      <input type="text" id="inp_year" class="clean-input draggable" style="top: 792px; left: 550px; width: 45px; height: 18px; text-align: center;">

      <input type="text" id="inp_from" class="clean-input draggable" style="top: 830px; left: 220px; width: 104px; height: 20px; text-align: center;">
      <input type="text" id="inp_to" class="clean-input draggable" style="top: 830px; left: 340px; width: 104px; height: 20px; text-align: center;">
    </div>
  </div>

  <textarea id="codeOutput" placeholder="Click 'Get Updated CSS Code' to generate position coordinates..."></textarea>

  <script>
    let isDragMode = false;
    let activeElement = null;
    let offsetX = 0, offsetY = 0;

    function toggleDragMode() {
      isDragMode = !isDragMode;
      const btn = document.querySelector('.btn-toggle');
      if (isDragMode) {
        document.body.classList.add('drag-mode');
        btn.innerHTML = "🛠️ Drag Mode: ON (Click & Drag elements)";
        btn.style.backgroundColor = "#2e7d32";
        enableDragging();
      } else {
        document.body.classList.remove('drag-mode');
        btn.innerHTML = "🛠️ Drag Mode: OFF";
        btn.style.backgroundColor = "#d32f2f";
      }
    }

    function enableDragging() {
      const draggables = document.querySelectorAll('.draggable');
      draggables.forEach(el => {
        el.onmousedown = function(e) {
          if (!isDragMode) return;
          e.preventDefault();
          activeElement = el;
          const rect = el.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;

          document.onmousemove = function(e) {
            if (!activeElement) return;
            const parentRect = document.getElementById('page1').getBoundingClientRect();
            let newLeft = e.clientX - parentRect.left - offsetX;
            let newTop = e.clientY - parentRect.top - offsetY;

            activeElement.style.left = newLeft + 'px';
            activeElement.style.top = newTop + 'px';
          };

          document.onmouseup = function() {
            activeElement = null;
            document.onmousemove = null;
          };
        };
      });
    }

    function generateCode() {
      const draggables = document.querySelectorAll('.draggable');
      let output = "";
      draggables.forEach(el => {
        output += `#${el.id} { top: ${el.style.top}; left: ${el.style.left}; }\n`;
      });
      const textarea = document.getElementById('codeOutput');
      textarea.value = output;
      textarea.style.display = 'block';
      textarea.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
