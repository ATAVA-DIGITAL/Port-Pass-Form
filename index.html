<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form - Absolute Red Box Alignment</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #2b2b2b;
      margin: 0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .page-container {
      position: relative;
      width: 794px;
      height: 1123px;
      background-color: #fff;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      page-break-after: always;
      overflow: hidden;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      object-fit: fill;
    }

    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* ചുവപ്പ് മാർക്ക് ചെയ്ത വരകളിൽ ടൈപ്പ് ചെയ്യാനുള്ള ഇൻപുട്ട് സ്റ്റൈൽ */
    .line-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 5px;
      height: 22px;
      line-height: 22px;
      font-family: 'Courier New', Courier, monospace, Arial;
    }

    .line-input:focus {
      background: rgba(255, 235, 59, 0.35); /* ടൈപ്പ് ചെയ്യുമ്പോൾ ലൈറ്റ് മഞ്ഞ നിറം കാണിക്കും */
    }

    /* ചെക്ക് ബോക്സ് മാർക്കിങ് */
    .check-box {
      position: absolute;
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    /* ഫോട്ടോ അപ്‌ലോഡ് ബോക്സ് */
    .photo-box {
      position: absolute;
      top: 130px;
      left: 54px;
      width: 100px;
      height: 102px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-box input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 12px 24px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }

    @page {
      size: A4 portrait;
      margin: 0mm !important;
    }

    @media print {
      body {
        background: white !important;
        padding: 0 !important;
      }
      .controls {
        display: none !important;
      }
      .page-container {
        width: 210mm !important;
        height: 297mm !important;
        box-shadow: none !important;
        margin: 0 !important;
      }
      .line-input:focus {
        background: transparent !important;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      
      <!-- 1. PHOTO UPLOAD BOX (ചുവപ്പ് ഫോട്ടോ ബോക്സ്) -->
      <div class="photo-box">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- 2. CHECKBOXES (ചുവപ്പ് ചെക്ക് ബോക്സുകൾ - FIRST ROW) -->
      <input type="checkbox" class="check-box" style="top: 182px; left: 198px;"> <!-- QUAY -->
      <input type="checkbox" class="check-box" style="top: 182px; left: 288px;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="check-box" style="top: 182px; left: 398px;"> <!-- COMPANY -->
      <input type="checkbox" class="check-box" style="top: 182px; left: 518px;"> <!-- RORO YARD -->
      <input type="checkbox" class="check-box" style="top: 182px; left: 625px;"> <!-- POLICE -->

      <!-- 3. CHECKBOXES (ചുവപ്പ് ചെക്ക് ബോക്സുകൾ - SECOND ROW) -->
      <input type="checkbox" class="check-box" style="top: 236px; left: 195px;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="check-box" style="top: 236px; left: 332px;"> <!-- IMMIGRATION -->
      <input type="checkbox" class="check-box" style="top: 236px; left: 432px;"> <!-- SHIP -->
      <input type="checkbox" class="check-box" style="top: 236px; left: 543px;"> <!-- ALL PLACES -->
      <input type="checkbox" class="check-box" style="top: 236px; left: 663px;"> <!-- DU TOWER -->

      <!-- 4. MAIN FORM RED LINES (ചുവന്ന വരകളിൽ മാത്രം ടൈപ്പ് ചെയ്യാനുള്ളവ) -->
      <input type="text" class="line-input" style="top: 285px; left: 248px; width: 362px;"> <!-- FULL NAME -->
      <input type="text" class="line-input" style="top: 320px; left: 248px; width: 362px;"> <!-- NATIONALITY -->
      <input type="text" class="line-input" style="top: 355px; left: 248px; width: 362px;"> <!-- PROFESSION -->
      <input type="text" class="line-input" style="top: 390px; left: 248px; width: 362px;"> <!-- PASSPORT NO -->
      <input type="text" class="line-input" style="top: 425px; left: 248px; width: 362px;"> <!-- UID NO -->
      <input type="text" class="line-input" style="top: 460px; left: 248px; width: 362px;"> <!-- EMIRATES ID NO -->
      <input type="text" class="line-input" style="top: 495px; left: 248px; width: 362px;"> <!-- COMPANY NAME -->
      <input type="text" class="line-input" style="top: 530px; left: 248px; width: 362px;"> <!-- COMPANY ADDRESS & TEL NO -->
      <input type="text" class="line-input" style="top: 565px; left: 248px; width: 362px;"> <!-- APPLICANT'S MOBILE NO -->
      <input type="text" class="line-input" style="top: 600px; left: 248px; width: 362px;"> <!-- REASON FOR PASS -->
      <input type="text" class="line-input" style="top: 635px; left: 248px; width: 362px;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="line-input" style="top: 670px; left: 248px; width: 362px;"> <!-- APPLICANT'S SIGNATURE -->
      <input type="text" class="line-input" style="top: 705px; left: 248px; width: 362px;"> <!-- VISA VALIDITY DATE -->

      <!-- 5. PORT PASS PERIOD RED BOXES (WEEK / MONTH / YEAR) -->
      <input type="text" class="line-input" style="top: 735px; left: 232px; width: 42px; height: 20px; text-align: center;"> <!-- WEEK -->
      <input type="text" class="line-input" style="top: 735px; left: 410px; width: 42px; height: 20px; text-align: center;"> <!-- MONTH -->
      <input type="text" class="line-input" style="top: 735px; left: 534px; width: 42px; height: 20px; text-align: center;"> <!-- YEAR -->

      <!-- 6. PORT PASS VALIDITY RED BOXES (FROM / TO) -->
      <input type="text" class="line-input" style="top: 771px; left: 213px; width: 86px; height: 22px; text-align: center;"> <!-- FROM -->
      <input type="text" class="line-input" style="top: 771px; left: 328px; width: 86px; height: 22px; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
