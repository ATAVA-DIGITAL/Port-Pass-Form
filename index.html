<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form - Perfect Print & Box Alignment</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .page-container {
      position: relative;
      width: 794px;
      height: 1123px;
      margin: 20px 0;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      page-break-after: always;
      page-break-inside: avoid;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .clean-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: 13.5px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 2px;
      font-family: Arial, sans-serif;
    }

    .clean-input:focus {
      background: rgba(255, 255, 180, 0.5);
    }

    /* Standard Native Checkbox Appearance */
    .clean-checkbox {
      position: absolute;
      width: 15px;
      height: 15px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    .photo-overlay {
      position: absolute;
      top: 142px;
      left: 70px;
      width: 100px;
      height: 115px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    @page {
      size: A4 portrait;
      margin: 0mm !important;
    }

    @media print {
      html, body {
        width: 100% !important;
        height: 100% !important;
        background: white !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .controls {
        display: none !important;
      }
      .page-container {
        width: 100% !important;
        height: 100vh !important;
        position: relative !important;
        margin: 0 !important;
        box-shadow: none !important;
        page-break-after: always !important;
        page-break-inside: avoid !important;
      }
      .clean-input:focus {
        background: transparent !important;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- Photo Area -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- TOP ROW CHECKBOXES (EXACTLY INSIDE BOXES) -->
      <input type="checkbox" class="clean-checkbox" style="top: 226px; left: 247px;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 226px; left: 371px;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 226px; left: 507px;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 226px; left: 650px;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 226px; left: 828px;"> <!-- POLICE -->

      <!-- SECOND ROW CHECKBOXES (EXACTLY INSIDE BOXES) -->
      <input type="checkbox" class="clean-checkbox" style="top: 293px; left: 254px;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 293px; left: 425px;"> <!-- IMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 293px; left: 550px;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 293px; left: 686px;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 293px; left: 833px;"> <!-- DU TOWER -->

      <!-- Main Text Inputs -->
      <input type="text" class="clean-input" style="top: 341px; left: 250px; width: 360px;"> <!-- FULL NAME -->
      <input type="text" class="clean-input" style="top: 383px; left: 250px; width: 360px;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 423px; left: 250px; width: 360px;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 464px; left: 250px; width: 360px;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 505px; left: 250px; width: 360px;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 546px; left: 250px; width: 360px;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 588px; left: 250px; width: 360px;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 628px; left: 250px; width: 360px;"> <!-- ADDRESS & TEL NO -->
      <input type="text" class="clean-input" style="top: 669px; left: 250px; width: 360px;"> <!-- MOBILE NO -->
      <input type="text" class="clean-input" style="top: 710px; left: 250px; width: 360px;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 751px; left: 250px; width: 360px;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 792px; left: 250px; width: 360px;"> <!-- SIGNATURE -->
      <input type="text" class="clean-input" style="top: 832px; left: 250px; width: 360px;"> <!-- VISA VALIDITY DATE -->

      <!-- BOTTOM BOXES: WEEK, MONTH, YEAR -->
      <input type="text" class="clean-input" style="top: 855px; left: 301px; width: 38px; height: 18px; text-align: center;"> <!-- WEEK -->
      <input type="text" class="clean-input" style="top: 855px; left: 521px; width: 38px; height: 18px; text-align: center;"> <!-- MONTH -->
      <input type="text" class="clean-input" style="top: 855px; left: 676px; width: 38px; height: 18px; text-align: center;"> <!-- YEAR -->

      <!-- BOTTOM BOXES: FROM / TO -->
      <input type="text" class="clean-input" style="top: 894px; left: 276px; width: 98px; height: 20px; text-align: center;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 894px; left: 421px; width: 98px; height: 20px; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
