<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Application Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #525659;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    /* Print Header Button */
    .print-btn-container {
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      text-align: center;
    }

    .btn-print {
      background-color: #28a745;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .btn-print:hover {
      background-color: #218838;
    }

    /* Main Form Container */
    .page-container {
      width: 800px;
      background: #ffffff;
      position: relative;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .page-image {
      width: 100%;
      display: block;
    }

    /* Clickable Photo Area */
    .photo-box {
      position: absolute;
      top: 15.6%;     /* കറക്റ്റ് ലൊക്കേഷൻ */
      left: 12.1%;    /* കറക്റ്റ് ലൊക്കേഷൻ */
      width: 92px;    /* ഒറിജിനൽ വിഡ്ത്ത് */
      height: 114px;  /* ഒറിജിനൽ ഹൈറ്റ് */
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #fileInput {
      display: none;
    }

    /* Print CSS for exact 2 pages only */
    @media print {
      body {
        background: none;
        padding: 0;
        margin: 0;
      }

      .no-print, .print-btn-container {
        display: none !important;
      }

      .page-container {
        box-shadow: none;
        margin: 0;
        width: 100%;
        page-break-after: always;
        page-break-inside: avoid;
      }

      .page-container:last-child {
        page-break-after: auto;
      }

      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Top Print Button Banner -->
  <div class="print-btn-container no-print">
    <button class="btn-print" onclick="window.print()">
      Print / Save 2 Pages as PDF / Powered by : ATAVA DIGITAL SERVICES & TRADING
    </button>
  </div>

  <!-- Hidden File Input for Uploading Photo -->
  <input type="file" id="fileInput" accept="image/*" onchange="previewPhoto(event)">

  <!-- PAGE 1 -->
  <div class="page-container">
    <!-- Template background image -->
    <img src="page1.jpg" class="page-image" alt="Port Pass Page 1">

    <!-- Interactive Photo Box -->
    <div class="photo-box" onclick="triggerFileInput()" title="Click to Upload Photo">
      <img id="uploadedPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23ccc' stroke-width='1.5'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='12' cy='10' r='3'/><path d='M7 21v-2a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v2'/></svg>" alt="Upload Photo">
    </div>

    <!-- Input fields for Page 1 can be positioned absolute here -->
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="page2.jpg" class="page-image" alt="Port Pass Page 2">
    <!-- Input fields for Page 2 can be positioned absolute here -->
  </div>

  <script>
    // Trigger hidden file input when photo box is clicked
    function triggerFileInput() {
      document.getElementById('fileInput').click();
    }

    // Load photo preview dynamically
    function previewPhoto(event) {
      const reader = new FileReader();
      reader.onload = function() {
        const img = document.getElementById('uploadedPhoto');
        img.src = reader.result;
      };
      if (event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
