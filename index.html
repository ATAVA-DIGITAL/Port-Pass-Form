<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form - Final Percent-Based Fix</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .page-container {
      position: relative;
      width: 794px;
      height: 1123px;
      margin: 20px 0;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      page-break-after: always;
      page-break-inside: avoid;
      overflow: hidden;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .clean-input {
      position: absolute;
      background: transparent;
      border: none;
      font-size: 13.5px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 2px;
      font-family: Arial, sans-serif;
    }

    .clean-input:focus {
      background: rgba(255, 255, 180, 0.5);
    }

    .clean-checkbox {
      position: absolute;
      width: 15px;
      height: 15px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    .photo-overlay {
      position: absolute;
      top: 12.6%;
      left: 8.8%;
      width: 12.6%;
      height: 10.2%;
      cursor: pointer;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    @page { size: A4 portrait; margin: 0mm !important; }

    @media print {
      html, body {
        width: 210mm !important;
        height: 297mm !important;
        background: white !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .controls { display: none !important; }
      .page-container {
        width: 210mm !important;
        height: 297mm !important;
        position: relative !important;
        margin: 0 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- Photo Field -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- TOP ROW CHECKBOXES -->
      <input type="checkbox" class="clean-checkbox" style="top: 19.3%; left: 30.5%;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 19.3%; left: 46.5%;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 19.3%; left: 63.5%;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 19.3%; left: 81.5%;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 19.3%; left: 98.2%;"> <!-- POLICE -->

      <!-- SECOND ROW CHECKBOXES -->
      <input type="checkbox" class="clean-checkbox" style="top: 25.3%; left: 31.6%;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 25.3%; left: 53.2%;"> <!-- IMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 25.3%; left: 68.8%;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 25.3%; left: 86.2%;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 25.3%; left: 104.5%;"> <!-- DU TOWER -->

      <!-- MAIN LINES -->
      <input type="text" class="clean-input" style="top: 29.3%; left: 40.0%; width: 44.8%;"> <!-- FULL NAME -->
      <input type="text" class="clean-input" style="top: 33.0%; left: 40.0%; width: 44.8%;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 36.1%; left: 40.0%; width: 44.8%;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 39.8%; left: 40.0%; width: 44.8%;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 43.0%; left: 40.0%; width: 44.8%;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 46.7%; left: 40.0%; width: 44.8%;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 49.9%; left: 40.0%; width: 44.8%;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 53.2%; left: 40.0%; width: 44.8%;"> <!-- ADDRESS & TEL NO -->
      <input type="text" class="clean-input" style="top: 56.8%; left: 40.0%; width: 44.8%;"> <!-- MOBILE NO -->
      <input type="text" class="clean-input" style="top: 60.3%; left: 40.0%; width: 44.8%;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 63.8%; left: 40.0%; width: 44.8%;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 67.1%; left: 40.0%; width: 44.8%;"> <!-- SIGNATURE -->
      <input type="text" class="clean-input" style="top: 70.6%; left: 40.0%; width: 44.8%;"> <!-- VISA VALIDITY DATE -->

      <!-- BOTTOM BOXES -->
      <input type="text" class="clean-input" style="top: 74.2%; left: 37.2%; width: 5.3%; text-align: center;"> <!-- WEEK -->
      <input type="text" class="clean-input" style="top: 74.2%; left: 64.8%; width: 5.3%; text-align: center;"> <!-- MONTH -->
      <input type="text" class="clean-input" style="top: 74.2%; left: 84.6%; width: 5.3%; text-align: center;"> <!-- YEAR -->

      <input type="text" class="clean-input" style="top: 77.9%; left: 32.5%; width: 12.0%; text-align: center;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 77.9%; left: 51.2%; width: 12.0%; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
