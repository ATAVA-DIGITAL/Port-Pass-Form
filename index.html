<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Form - Exact Box Layout</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .page-container {
      position: relative;
      width: 794px;
      height: 1123px;
      margin: 20px 0;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      page-break-after: always;
      page-break-inside: avoid;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .overlay-form {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .clean-input {
      position: absolute;
      background: rgba(255, 235, 235, 0.6);
      border: 1px solid #ff4d4d;
      font-size: 13.5px;
      font-weight: bold;
      color: #000;
      outline: none;
      padding: 0 4px;
      font-family: Arial, sans-serif;
      border-radius: 2px;
    }

    .clean-input:focus {
      background: #ffffff;
      border-color: #0d47a1;
    }

    .clean-checkbox {
      position: absolute;
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
      accent-color: #000;
    }

    .photo-overlay {
      position: absolute;
      top: 142px;
      left: 70px;
      width: 100px;
      height: 115px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-overlay input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .photo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    @page {
      size: A4 portrait;
      margin: 0mm !important;
    }

    @media print {
      html, body {
        width: 210mm !important;
        height: 297mm !important;
        background: white !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .controls {
        display: none !important;
      }
      .page-container {
        width: 210mm !important;
        height: 297mm !important;
        position: relative !important;
        margin: 0 !important;
        box-shadow: none !important;
        page-break-after: always !important;
        page-break-inside: avoid !important;
      }
      .clean-input {
        background: transparent !important;
        border: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- PAGE 1 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0001.jpg" class="bg-image" alt="Port Pass Page 1">

    <div class="overlay-form">
      <!-- Photo Field -->
      <div class="photo-overlay">
        <img id="imgPreview" style="display:none;">
        <input type="file" accept="image/*" title="Click to Upload Photo" onchange="loadPhoto(event)">
      </div>

      <!-- TOP ROW CHECKBOXES -->
      <input type="checkbox" class="clean-checkbox" style="top: 216px; left: 191px;"> <!-- QUAY -->
      <input type="checkbox" class="clean-checkbox" style="top: 216px; left: 292px;"> <!-- WAREHOUSE -->
      <input type="checkbox" class="clean-checkbox" style="top: 216px; left: 399px;"> <!-- COMPANY -->
      <input type="checkbox" class="clean-checkbox" style="top: 216px; left: 512px;"> <!-- RORO YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 216px; left: 622px;"> <!-- POLICE -->

      <!-- SECOND ROW CHECKBOXES -->
      <input type="checkbox" class="clean-checkbox" style="top: 268px; left: 196px;"> <!-- CONTAINER YARD -->
      <input type="checkbox" class="clean-checkbox" style="top: 268px; left: 334px;"> <!-- IMIGRATION -->
      <input type="checkbox" class="clean-checkbox" style="top: 268px; left: 433px;"> <!-- SHIP -->
      <input type="checkbox" class="clean-checkbox" style="top: 268px; left: 541px;"> <!-- ALL PLACES -->
      <input type="checkbox" class="clean-checkbox" style="top: 268px; left: 658px;"> <!-- DU TOWER -->

      <!-- MAIN INPUT BOXES (MATCHING YOUR RED BOXES IMAGE) -->
      <input type="text" class="clean-input" style="top: 327px; left: 253px; width: 356px; height: 22px;"> <!-- APPLICANT'S FULL NAME -->
      <input type="text" class="clean-input" style="top: 367px; left: 253px; width: 356px; height: 22px;"> <!-- NATIONALITY -->
      <input type="text" class="clean-input" style="top: 403px; left: 253px; width: 356px; height: 22px;"> <!-- PROFESSION -->
      <input type="text" class="clean-input" style="top: 444px; left: 253px; width: 356px; height: 22px;"> <!-- PASSPORT NO -->
      <input type="text" class="clean-input" style="top: 480px; left: 253px; width: 356px; height: 22px;"> <!-- UID NO -->
      <input type="text" class="clean-input" style="top: 518px; left: 253px; width: 356px; height: 22px;"> <!-- EMIRATES ID NO -->
      <input type="text" class="clean-input" style="top: 556px; left: 253px; width: 356px; height: 22px;"> <!-- COMPANY NAME -->
      <input type="text" class="clean-input" style="top: 593px; left: 253px; width: 356px; height: 22px;"> <!-- COMPANY ADDRESS & TEL NO -->
      <input type="text" class="clean-input" style="top: 631px; left: 253px; width: 356px; height: 22px;"> <!-- APPLICANT'S MOBILE NO -->
      <input type="text" class="clean-input" style="top: 672px; left: 253px; width: 356px; height: 22px;"> <!-- REASON FOR PASS -->
      <input type="text" class="clean-input" style="top: 712px; left: 253px; width: 356px; height: 22px;"> <!-- DATE OF APPLICATION -->
      <input type="text" class="clean-input" style="top: 750px; left: 253px; width: 356px; height: 22px;"> <!-- APPLICANT'S SIGNATURE -->
      <input type="text" class="clean-input" style="top: 788px; left: 253px; width: 356px; height: 22px;"> <!-- VISA VALIDITY DATE -->

      <!-- BOTTOM PERIOD BOXES -->
      <input type="text" class="clean-input" style="top: 830px; left: 234px; width: 42px; height: 22px; text-align: center;"> <!-- WEEK -->
      <input type="text" class="clean-input" style="top: 830px; left: 409px; width: 42px; height: 22px; text-align: center;"> <!-- MONTH -->
      <input type="text" class="clean-input" style="top: 830px; left: 535px; width: 42px; height: 22px; text-align: center;"> <!-- YEAR -->

      <!-- BOTTOM VALIDITY DATES -->
      <input type="text" class="clean-input" style="top: 872px; left: 205px; width: 93px; height: 24px; text-align: center;"> <!-- FROM -->
      <input type="text" class="clean-input" style="top: 872px; left: 323px; width: 93px; height: 24px; text-align: center;"> <!-- TO -->
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="GATE PASS13081_page-0002.jpg" class="bg-image" alt="Port Pass Page 2">
  </div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('imgPreview');
        img.src = reader.result;
        img.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
