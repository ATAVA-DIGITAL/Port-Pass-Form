<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Pass Application Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #525659;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .print-btn-container {
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      text-align: center;
    }

    .btn-print {
      background-color: #28a745;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      width: 100%;
    }

    .page-container {
      width: 800px;
      min-height: 1100px; /* ഇമേജ് കാണാത്തപ്പോഴും ബോക്സ് ഇടിയാതിരിക്കാൻ */
      background: #ffffff;
      position: relative;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .page-image {
      width: 100%;
      display: block;
    }

    /* photo box positioning */
    .photo-box {
      position: absolute;
      top: 15.6%;
      left: 12.1%;
      width: 92px;
      height: 114px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #fileInput {
      display: none;
    }

    /* Print Fix */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      html, body {
        background: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print, .print-btn-container {
        display: none !important;
      }
      .page-container {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        height: 100vh !important;
        page-break-after: always;
        page-break-inside: avoid;
      }
      .page-container:last-child {
        page-break-after: auto;
      }
    }
  </style>
</head>
<body>

  <!-- Print Button Banner -->
  <div class="print-btn-container no-print">
    <button class="btn-print" onclick="window.print()">
      Print / Save 2 Pages as PDF / Powered by : ATAVA DIGITAL SERVICES & TRADING
    </button>
  </div>

  <input type="file" id="fileInput" accept="image/*" onchange="previewPhoto(event)">

  <!-- PAGE 1 -->
  <div class="page-container">
    <!-- ശ്രദ്ധിക്കുക: നിങ്ങളുടെ ഫോൾഡറിലുള്ള ചിത്രത്തിന്റെ പേര് താഴെ നൽകുക (ഉദാഹരണത്തിന്: src="page1.jpg" അല്ലെങ്കിൽ src="1.jpg") -->
    <img src="page1.jpg" class="page-image" alt="">

    <!-- Photo Overlay -->
    <div class="photo-box" onclick="document.getElementById('fileInput').click();">
      <img id="uploadedPhoto" src="" alt="">
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-container">
    <img src="page2.jpg" class="page-image" alt="">
  </div>

  <script>
    function previewPhoto(event) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById('uploadedPhoto').src = reader.result;
      };
      if (event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }
  </script>
</body>
</html>
